<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyTracker | Login</title>
<!-- Bootstrap 5 (free CSS framework) and Bootstrap Icons, loaded from a free CDN -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
<!-- Our own styles (always load AFTER Bootstrap so ours can override it) -->
<link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
<main class="container">
<div class="row justify-content-center align-items-center min-vh-100">
<div class="col-12 col-sm-10 col-md-7 col-lg-5">
<div class="card auth-card shadow-lg border-0">
<div class="card-body p-4 p-md-5">
<!-- App brand: CHANGE the icon and name to match YOUR concept -->
<div class="text-center mb-4">
<div class="brand-icon mb-2"><i class="bi bi-graph-up-arrow"></i></div>
<h1 class="h3 fw-bold mb-0" id="appName">MyTracker</h1>
<p class="text-muted small mb-0">Track your expenses, anytime.</p>
</div>
<!-- Tabs to switch between Login and Register -->
<ul class="nav nav-pills nav-fill mb-4" role="tablist">
<li class="nav-item" role="presentation">
<button class="nav-link active" id="login-tab" data-bs-toggle="pill"
data-bs-target="#login-pane" type="button" role="tab">Login</button>
</li>
<li class="nav-item" role="presentation">
<button class="nav-link" id="register-tab" data-bs-toggle="pill"
data-bs-target="#register-pane" type="button"
role="tab">Register</button>
</li>
</ul>
<!-- Message area (errors / success) -->
<div id="message" class="alert d-none" role="alert"></div>
<div class="tab-content">
<!-- ===== LOGIN FORM ===== -->
<div class="tab-pane fade show active" id="login-pane" role="tabpanel">
<form id="loginForm" novalidate>
<div class="mb-3">
<label for="loginEmail" class="form-label">Email</label>
<input type="email" class="form-control" id="loginEmail"
placeholder="you@example.com" required>
</div>
<div class="mb-3">
<label for="loginPassword" class="form-label">Password</label>
<input type="password" class="form-control" id="loginPassword"
placeholder="Your password" required>
</div>
<button type="submit" class="btn btn-primary w-100" id="loginBtn">
<i class="bi bi-box-arrow-in-right me-1"></i> Login
</button>
<p class="text-center text-muted small mt-3 mb-0">
Demo account: <code>demo@mytracker.com</code> / <code>demo1234</code>
</p>
</form>
</div>
<!-- ===== REGISTER FORM ===== -->
<div class="tab-pane fade" id="register-pane" role="tabpanel">
<form id="registerForm" novalidate>
<div class="mb-3">
<label for="regName" class="form-label">Full name</label>
<input type="text" class="form-control" id="regName"
placeholder="Juan Dela Cruz" required>
</div>
<div class="mb-3">
<label for="regEmail" class="form-label">Email</label>
<input type="email" class="form-control" id="regEmail"
placeholder="you@example.com" required>
</div>
<div class="mb-3">
<label for="regPassword" class="form-label">
Password <span class="text-muted small">(at least 8 characters)</span>
</label>
<input type="password" class="form-control" id="regPassword" required>
</div>
<div class="mb-3">
<label for="regConfirm" class="form-label">Confirm password</label>
<input type="password" class="form-control" id="regConfirm" required>
</div>
<button type="submit" class="btn btn-success w-100" id="registerBtn">
<i class="bi bi-person-plus me-1"></i> Create account
</button>
</form>
</div>
</div>
</div>
</div>
</div>
<p class="text-center text-white-50 small mt-3">
&copy; 2026 MyTracker &middot; Web Engineering Midterm
</p>
</div>
</div>
</main>
<!-- Bootstrap JS (needed for the tabs) -->
<script
src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<!-- Our scripts: auth.js MUST come before login.js -->
<script src="js/auth.js"></script>
<script src="js/login.js"></script>
</body>
</html>
